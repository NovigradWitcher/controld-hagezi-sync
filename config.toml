# =============================================================================
# PROFILE → FOLDER MAPPINGS
# =============================================================================
# For each profile, list which folders (by friendly name) it should receive.
# Use the exact names from the [folders] section above.
# =============================================================================

[profile_folders]
Hardened   = ["Badware Hoster", "Native Tracker Amazon", "Native Tracker Apple", "Native Tracker Huawei", "Native Tracker LG webOS", "Native Tracker Microsoft", "Native Tracker Oppo Realme", "Native Tracker Roku", "Native Tracker Samsung", "Native Tracker TikTok - Agg", "Native Tracker TikTok", "Native Tracker Vivo", "Native Tracker Xiaomi", "Ultimate Known Issues Allow"]

Basic      = ["Apple Private Relay Allow", "Badware Hoster", "Native Tracker Amazon", "Native Tracker Apple", "Native Tracker Huawei", "Native Tracker LG webOS", "Native Tracker Microsoft", "Native Tracker Oppo Realme", "Native Tracker Roku", "Native Tracker Samsung", , "Native Tracker TikTok", "Native Tracker Vivo", "Native Tracker Xiaomi", "Ultimate Known Issues Allow"]
